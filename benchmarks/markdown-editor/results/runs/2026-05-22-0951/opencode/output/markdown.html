<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Self-contained Markdown Editor</title>
  <style>
    html, body { height: 100%; margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; }
    .container { display: flex; height: 100%; }
    .pane { flex: 1 1 50%; box-sizing: border-box; padding: 12px; }
    .left { border-right: 1px solid #ddd; }
    textarea { width: 100%; height: 100%; resize: none; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 14px; line-height: 1.4; }
    .preview { height: 100%; overflow: auto; }
    pre { background: #f7f7f7; padding: 10px; overflow: auto; }
    code { background: #f2f2f2; padding: 0 3px; }
    blockquote { border-left: 4px solid #ddd; padding-left: 10px; color: #555; margin: 0.5em 0; }
    h1, h2, h3, h4, h5, h6 { margin: 0.6em 0 0.3em; }
    p { margin: 0.5em 0; }
    ul, ol { margin: 0.5em 0 0.5em 1.2em; }
  </style>
</head>
<body>
  <div class="container">
    <div class="pane left">
      <textarea id="editor" spellcheck="false"># Markdown Editor

Type markdown on the left. Live preview updates on the right.

## Features
- **Bold**, *italic*, and ***both***
- Lists
  - Nested one level
1. Ordered lists
2. Too

Inline code: `x < y`

```
Fenced code blocks
<b>are escaped</b>
```

Links: [Cloudflare](https://www.cloudflare.com) and [unsafe](javascript:alert(1))

> Blockquote line 1
> and **bold**
</textarea>
    </div>
    <div class="pane">
      <div id="preview" class="preview"></div>
    </div>
  </div>

  <script>
  // Parser (duplicated from markdown.js, kept in sync intentionally)
  function escapeHtml(s = "") {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/\"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function sanitizeUrl(url = "") {
    const raw = String(url).trim();
    if (raw.startsWith('#') || raw.startsWith('/') || raw.startsWith('./') || raw.startsWith('../')) return raw;
    const m = raw.match(/^([a-zA-Z][a-zA-Z0-9+.-]*):/);
    if (!m) return raw;
    const scheme = m[1].toLowerCase();
    if (scheme === 'http' || scheme === 'https' || scheme === 'mailto') return raw;
    return null;
  }

  function parseMarkdown(input = "") {
    const lines = String(input).split(/\r?\n/);
    const out = [];
    let i = 0;

    const renderInline = (text, { allowLinks = true } = {}) => {
      let working = String(text);
      const tokens = [];
      const ph = (idx) => `§§T${idx}§§`;

      working = working.replace(/`([^`]+)`/g, (_, code) => {
        const idx = tokens.push(`<code>${escapeHtml(code)}</code>`) - 1;
        return ph(idx);
      });

      if (allowLinks) {
        working = working.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, txt, url) => {
          const safe = sanitizeUrl(url);
          if (safe) {
            const inner = renderInline(txt, { allowLinks: false });
            const idx = tokens.push(`<a href=\"${escapeHtml(safe)}\">${inner}</a>`) - 1;
            return ph(idx);
          } else {
            const inner = renderInline(txt, { allowLinks: false });
            const idx = tokens.push(inner) - 1;
            return ph(idx);
          }
        });
      }

      working = escapeHtml(working);
      working = working.replace(/\*\*\*([\s\S]+?)\*\*\*/g, '<strong><em>$1</em></strong>');
      working = working.replace(/\*\*([\s\S]+?)\*\*/g, '<strong>$1</strong>');
      working = working.replace(/_([^_\n]+)_/g, '<em>$1</em>');
      working = working.replace(/(^|[^*])\*([^*\n]+)\*/g, (m, pre, body) => `${pre}<em>${body}</em>`);

      working = working.replace(/§§T(\d+)§§/g, (_, n) => tokens[Number(n)] ?? '');
      return working;
    };

    const matchListLine = (idx) => {
      if (idx >= lines.length) return null;
      const line = lines[idx];
      let m = line.match(/^(\s*)([-*+])\s+(.+)$/);
      if (m) return { indent: m[1].length, type: 'ul', text: m[3] };
      m = line.match(/^(\s*)(\d+)\.\s+(.+)$/);
      if (m) return { indent: m[1].length, type: 'ol', text: m[3] };
      return null;
    };

    const parseList = (startIdx, baseIndent, listType) => {
      let html = listType === 'ul' ? '<ul>' : '<ol>';
      let idx = startIdx;
      while (idx < lines.length) {
        const m = matchListLine(idx);
        if (!m) break;
        if (m.indent < baseIndent) break;
        if (m.indent > baseIndent && m.indent !== baseIndent + 2) break;
        if (m.indent === baseIndent && m.type !== listType) break;

        if (m.indent === baseIndent && m.type === listType) {
          html += `<li>${renderInline(m.text)}`;
          idx++;
          const n = matchListLine(idx);
          if (n && n.indent === baseIndent + 2) {
            const [childHtml, nextIdx] = parseList(idx, baseIndent + 2, n.type);
            html += childHtml;
            idx = nextIdx;
          }
          html += `</li>`;
          continue;
        }
        break;
      }
      html += listType === 'ul' ? '</ul>' : '</ol>';
      return [html, idx];
    };

    while (i < lines.length) {
      const line = lines[i];
      if (/^```/.test(line)) {
        i++;
        const buf = [];
        while (i < lines.length && !/^```\s*$/.test(lines[i])) {
          buf.push(lines[i]);
          i++;
        }
        if (i < lines.length && /^```\s*$/.test(lines[i])) i++;
        const code = escapeHtml(buf.join('\n'));
        out.push(`<pre><code>${code}</code></pre>`);
        continue;
      }
      if (/^#{1,6} /.test(line)) {
        const m = line.match(/^(#{1,6})\s+(.*)$/);
        const level = m[1].length;
        out.push(`<h${level}>${renderInline(m[2])}</h${level}>`);
        i++;
        continue;
      }
      const lm = matchListLine(i);
      if (lm && lm.indent === 0) {
        const [listHtml, nextI] = parseList(i, 0, lm.type);
        out.push(listHtml);
        i = nextI;
        continue;
      }
      if (/^>\s?/.test(line)) {
        const quoteLines = [];
        while (i < lines.length && /^>\s?/.test(lines[i])) {
          quoteLines.push(lines[i].replace(/^>\s?/, ''));
          i++;
        }
        const inner = quoteLines.map(l => renderInline(l)).join('<br/> ');
        out.push(`<blockquote><p>${inner}</p></blockquote>`);
        continue;
      }
      if (line.trim() !== '') {
        const buf = [line.trim()];
        i++;
        while (i < lines.length && lines[i].trim() !== '') {
          buf.push(lines[i].trim());
          i++;
        }
        out.push(`<p>${renderInline(buf.join(' '))}</p>`);
        continue;
      }
      i++;
    }
    return out.join('\n');
  }

  // UI wiring with debounced live preview (250ms)
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  let timer = null;
  const DEBOUNCE_MS = 250;
  function render() {
    preview.innerHTML = parseMarkdown(editor.value);
  }
  editor.addEventListener('input', () => {
    if (timer) clearTimeout(timer);
    timer = setTimeout(render, DEBOUNCE_MS);
  });
  // Initial render
  render();
  </script>
</body>
</html>
